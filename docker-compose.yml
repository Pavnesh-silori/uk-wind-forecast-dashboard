services:
  backend:
    build:
      context: ./backend
    container_name: wind-dashboard-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: wind-dashboard-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend